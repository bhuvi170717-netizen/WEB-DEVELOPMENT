
<!DOCTYPE html>
<html>

<head>
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#matches">Matches</a>
    </nav>

    <!-- Booking Form -->
    <section>

        <h2>IPL Ticket Booking Form</h2>

        <form id="bookingForm">

            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                placeholder="Enter your name"
                minlength="3" maxlength="30"
                required>
            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                placeholder="Enter your email"
                required>
            <br><br>

            <!-- Phone -->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                placeholder="Enter 10 digit number"
                pattern="[0-9]{10}"
                required>
            <br><br>

            <!-- Match Selection -->
            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">Choose Match</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="CSK vs MI">CSK vs MI</option>
            </select>
            <br><br>

            <!-- Stand Category -->
            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">Choose Stand</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>
            <br><br>

            <!-- Number of Tickets -->
            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" name="tickets"
                min="1" max="10" value="1" required>
            <br><br>

            <!-- Booking Preference -->
            <label>Booking Preference:</label>
            <br>

            <input type="radio" name="preference" value="Online">
            Online Payment

            <input type="radio" name="preference" value="Offline">
            Offline Payment

            <br><br>

            <!-- Buttons -->
            <button type="submit">Submit Booking</button>
            <button type="reset">Reset</button>

        </form>

    </section>

    <!-- Booking Summary -->
    <section class="summary">

        <h2>Booking Summary</h2>

        <p>Match: <span id="summaryMatch">Not selected</span></p>

        <p>Stand: <span id="summaryStand">Not selected</span></p>

        <p>Ticket Quantity: <span id="summaryQuantity">1</span></p>

        <p>Price per Ticket: ₹<span id="summaryPrice">0</span></p>

        <h3>Total Amount: ₹<span id="summaryTotal">0</span></h3>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 IPL Ticket Booking Website</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
